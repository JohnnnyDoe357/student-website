<!DOCTYPE html>
<html>
<head>
    <title>Student Information System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Student Information System</h1>

<div class="form-container">

    <input type="text" id="name" placeholder="Student Name">

    <input type="text" id="usn" placeholder="USN / Roll Number">

    <input type="text" id="dept" placeholder="Department">

    <input type="text" id="semester" placeholder="Semester">

    <input type="date" id="dob">

    <input type="text" id="contact" placeholder="Contact Number">

    <input type="email" id="email" placeholder="Email ID">

    <textarea id="address" placeholder="Address"></textarea>

    <input type="number" id="attendance" placeholder="Attendance %">

    <input type="text" id="cgpa" placeholder="CGPA">

    <input type="text" id="achievement"
        placeholder="Achievements / Certifications">

    <input type="text" id="placement"
        placeholder="Placement Details">

    <input type="file" id="photo">

    <button onclick="addStudent()">
        Add Student
    </button>

</div>

<hr>

<h2>Student Records</h2>

<div id="studentList"></div>

<script src="script.js"></script>

</body>
</html>
